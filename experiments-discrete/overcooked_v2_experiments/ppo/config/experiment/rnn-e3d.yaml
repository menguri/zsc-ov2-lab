# @package _global_
defaults:
  - override /model: rnn

# E3D 알고리즘 설정
ALG_NAME: "E3D"

# 파트너가 무작위 행동을 취할 확률 (0.5 = 50%)
E3D_EPSILON: 0.5

# 파트너 방향성, 자신의 방향성 선택
EGO_DIRECTION: True

# 파트너 모델링 사용 여부 (True: 파트너 예측 네트워크 사용, False: 사용 안 함 - Ablation용)
USE_PARTNER_MODELING: True

# 파트너 예측 손실 계수
PRED_LOSS_COEF: 1.0